services:
  # SYNOHACK 2026 Static Site (Render Free Tier, Global CDN, No sleep timeouts)
  - type: web
    name: synohack-2026
    runtime: static
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/synohack-2026 run build
    staticPublishPath: artifacts/synohack-2026/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
